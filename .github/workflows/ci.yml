name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # These are deliberately non-secret, CI-only placeholders. The production
    # image guard checks live-key prefixes, while the tests never call Clerk.
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tier_bench?sslmode=disable
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2ktY2xlcmstMDAuY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_live_ci-placeholder
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tier_bench
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tier_bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production image with public Clerk configuration
        shell: bash
        run: >-
          docker build
          --tag tier-bench:ci
          --build-arg NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
          --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
          --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/rank
          --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/rank
          --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY=ci-placeholder-site-key
          .
      - name: Apply migrations from production image
        run: docker run --rm --network host --env DATABASE_URL tier-bench:ci npm run db:migrate
      - name: Verify schema and migration idempotency
        run: node --test tests/db-migrations.test.mjs
      - name: Test catalog safety and database-backed routes
        run: npm run test:integration
      - name: Smoke-test the container health route
        shell: bash
        run: |
          container_id=$(docker run --detach --network host \
            --env DATABASE_URL \
            --env NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
            --env CLERK_SECRET_KEY \
            tier-bench:ci)
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          response=""
          for attempt in {1..30}; do
            if response=$(curl --fail --silent --show-error http://localhost:3000/api/health); then
              break
            fi
            sleep 1
          done
          if test -z "$response"; then
            docker logs "$container_id"
            curl --silent --show-error http://localhost:3000/api/health || true
            exit 1
          fi
          node -e 'const body = JSON.parse(process.argv[1]); if (body.status !== "ok") process.exit(1)' "$response"
