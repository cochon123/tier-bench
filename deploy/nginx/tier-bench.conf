# Replace rankings.example.com and the certificate paths before enabling this
# site. Keep the Next.js port bound to 127.0.0.1 (see docker-compose.production.yml).

server {
    listen 80;
    listen [::]:80;
    server_name rankings.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rankings.example.com;

    ssl_certificate /etc/letsencrypt/live/rankings.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rankings.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;

    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
