# Certificate-free bootstrap configuration. Enable this file first, issue the
# certificate with Certbot's webroot mode, then replace it with tier-bench.conf.

server {
    listen 80;
    listen [::]:80;
    server_name rankings.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 200 "TLS certificate bootstrap in progress.\n";
    }
}
